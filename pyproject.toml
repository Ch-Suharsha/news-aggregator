[project]
name = "news-aggregator"
version = "0.1.0"
description = "AI news aggregator with local PostgreSQL storage and daily digests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "fastapi>=0.115.5",
    "google-api-python-client>=2.154.0",
    "httpx>=0.27.2",
    "openai>=1.51.0",
    "pydantic>=2.10.3",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0.post0",
    "resend>=2.15.0",
    "sqlalchemy>=2.0.36",
    "tenacity>=9.0.0",
    "trafilatura>=1.12.2",
    "typer>=0.15.1",
    "uvicorn[standard]>=0.32.1",
    "youtube-transcript-api>=0.6.3",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.2",
]

[project.scripts]
news-aggregator = "app:main"
youtube-feed = "app.cli.youtube:main"
news-run = "app.cli.run:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
